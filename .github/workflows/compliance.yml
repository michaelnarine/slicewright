name: compliance

# CI runs on pushes to main and by hand (Actions tab -> Run workflow), not on pull requests.
# The dco job below only runs for pull_request events, so it is skipped here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spdx-boundary:
    name: SPDX boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python .github/scripts/check_spdx.py .
      - run: python -m pip install pytest && python -m pytest -q .github/scripts

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/check_dco.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  api-stub:
    name: Engine API stub matches 04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest mypy numpy
      - run: python -m pytest -q engine/tests
      - run: mypy engine/python/slicewright_engine/__init__.pyi
