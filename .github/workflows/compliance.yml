name: compliance

# Stacked PRs target other PR branches, so no branch filter on pull_request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spdx-boundary:
    name: SPDX boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python .github/scripts/check_spdx.py .
      - run: python -m pip install pytest && python -m pytest -q .github/scripts

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/check_dco.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
