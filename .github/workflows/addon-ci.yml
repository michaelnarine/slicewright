name: addon-ci

# Stacked PRs target other PR branches, so no branch filter on pull_request.
on:
  pull_request:
    paths: ["addon/**", "engine/python/**", "docs/design/04-engine-api.md", ".github/workflows/addon-ci.yml"]
  push:
    branches: [main]
    paths: ["addon/**", "engine/python/**", "docs/design/04-engine-api.md", ".github/workflows/addon-ci.yml"]

permissions:
  contents: read

env:
  PYTEST_VERSION: "9.1.1"
  NUMPY_VERSION: "2.5.3"

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install "pytest==${PYTEST_VERSION}" "numpy==${NUMPY_VERSION}"
      - name: pytest (contract suite, unit tests)
        run: python -m pytest addon/tests -ra -q
